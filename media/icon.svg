<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2421"/>
      <stop offset="1" stop-color="#131116"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b08f"/>
      <stop offset="1" stop-color="#d9643f"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3baff"/>
      <stop offset="1" stop-color="#7a66f0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6c7ae"/>
    </linearGradient>
    <filter id="glow-clay" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#e8825c" flood-opacity="0.75"/>
    </filter>
    <filter id="glow-iris" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8b7cf6" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="128" cy="128" r="118" fill="url(#halo)"/>

  <circle cx="128" cy="128" r="84" fill="none" stroke="#d97757" stroke-opacity="0.18" stroke-width="22"/>
  <circle cx="128" cy="128" r="54" fill="none" stroke="#8b7cf6" stroke-opacity="0.2" stroke-width="22"/>

  <g transform="rotate(-90 128 128)" fill="none" stroke-width="22" stroke-linecap="round">
    <!-- Circumferences: 2π·84 ≈ 527.8, 2π·54 ≈ 339.3 -->
    <circle cx="128" cy="128" r="84" stroke="url(#clay)" stroke-dasharray="380 600" filter="url(#glow-clay)"/>
    <circle cx="128" cy="128" r="54" stroke="url(#iris)" stroke-dasharray="190 400" filter="url(#glow-iris)"/>
  </g>

  <path fill="url(#spark)" d="M128 104c2.2 12.6 9.4 19.8 22 22v4c-12.6 2.2-19.8 9.4-22 22h-0c-2.2-12.6-9.4-19.8-22-22v-4c12.6-2.2 19.8-9.4 22-22Z"/>
</svg>
